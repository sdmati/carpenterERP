services:
  postgres:
    image: postgres:16-alpine
    container_name: stolarz-erp-db
    restart: always
    environment:
      POSTGRES_USER: uzytkownik
      POSTGRES_PASSWORD: haslo
      POSTGRES_DB: stolarz_erp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
